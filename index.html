<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>التاريخ الوطني - الوحدة الأولى</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    line-height: 1.8;
    padding-bottom: 80px;
    overflow-x: hidden;
}
.header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
    padding: 20px 16px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.header h1 {
    font-size: 1.3rem;
    margin-bottom: 5px;
}
.header p {
    font-size: 0.85rem;
    opacity: 0.8;
}
.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 16px;
}
/* شاشة البداية */
.home-screen {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.home-card {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    border-right: 5px solid #0f3460;
    display: flex;
    align-items: center;
    gap: 14px;
}
.home-card:active {
    transform: scale(0.97);
}
.home-card .icon {
    font-size: 2rem;
    width: 50px;
    text-align: center;
}
.home-card .info h3 {
    font-size: 1rem;
    color: #1a1a2e;
}
.home-card .info p {
    font-size: 0.8rem;
    color: #666;
    margin-top: 2px;
}
.home-card .progress-badge {
    margin-right: auto;
    font-size: 0.75rem;
    background: #e8f5e9;
    color: #2e7d32;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
}
.home-card .progress-badge.done {
    background: #e3f2fd;
    color: #1565c0;
}
/* شاشة الأسئلة */
.quiz-screen {
    display: none;
}
.quiz-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
}
.btn-back {
    background: #fff;
    border: none;
    font-size: 1.2rem;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    color: #0f3460;
    font-weight: bold;
}
.quiz-title {
    font-size: 1rem;
    font-weight: bold;
    color: #1a1a2e;
}
/* شريط التنقل */
.nav-bar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 10px 4px;
    margin-bottom: 16px;
    scrollbar-width: none;
    -ms-overflow-style: none;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.nav-bar::-webkit-scrollbar {
    display: none;
}
.nav-btn {
    min-width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 2px solid #e0e0e0;
    background: #fff;
    font-size: 0.8rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #666;
}
.nav-btn.active {
    background: #0f3460;
    color: #fff;
    border-color: #0f3460;
}
.nav-btn.correct {
    background: #4caf50;
    color: #fff;
    border-color: #4caf50;
}
.nav-btn.wrong {
    background: #f44336;
    color: #fff;
    border-color: #f44336;
}
/* بطاقة السؤال */
.question-card {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    margin-bottom: 16px;
}
.question-number {
    font-size: 0.8rem;
    color: #0f3460;
    font-weight: bold;
    margin-bottom: 8px;
}
.question-text {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 16px;
    color: #1a1a2e;
}
.options {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.option {
    padding: 14px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.95rem;
    background: #fafafa;
    display: flex;
    align-items: center;
    gap: 10px;
}
.option:active {
    transform: scale(0.98);
}
.option .letter {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: bold;
    flex-shrink: 0;
    color: #666;
}
.option.correct {
    background: #e8f5e9;
    border-color: #4caf50;
}
.option.correct .letter {
    background: #4caf50;
    color: #fff;
}
.option.wrong {
    background: #ffebee;
    border-color: #f44336;
}
.option.wrong .letter {
    background: #f44336;
    color: #fff;
}
.option.disabled {
    pointer-events: none;
    opacity: 0.7;
}
/* التصحيح الوقتي */
.feedback {
    margin-top: 16px;
    padding: 14px;
    border-radius: 12px;
    font-size: 0.9rem;
    display: none;
    animation: fadeIn 0.3s ease;
}
.feedback.show {
    display: block;
}
.feedback.correct {
    background: #e8f5e9;
    border-right: 4px solid #4caf50;
    color: #2e7d32;
}
.feedback.wrong {
    background: #ffebee;
    border-right: 4px solid #f44336;
    color: #c62828;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
}
/* أزرار التنقل السفلي */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
    z-index: 100;
    max-width: 700px;
    margin: 0 auto;
}
.bottom-nav button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
}
.btn-prev {
    background: #f0f2f5;
    color: #1a1a2e;
}
.btn-next {
    background: #0f3460;
    color: #fff;
}
.btn-next:active, .btn-prev:active {
    transform: scale(0.97);
}
.btn-next:disabled {
    background: #ccc;
    color: #888;
}
/* شاشة النتيجة */
.result-screen {
    display: none;
    text-align: center;
    padding: 40px 16px;
}
.result-card {
    background: #fff;
    border-radius: 20px;
    padding: 30px 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}
.result-card h2 {
    font-size: 1.5rem;
    margin-bottom: 16px;
}
.result-score {
    font-size: 3rem;
    font-weight: bold;
    color: #0f3460;
    margin: 16px 0;
}
.result-details {
    font-size: 0.95rem;
    color: #666;
    margin-bottom: 20px;
}
.result-details span {
    display: inline-block;
    margin: 0 8px;
}
.result-details .green { color: #4caf50; font-weight: bold; }
.result-details .red { color: #f44336; font-weight: bold; }
.btn-restart {
    background: #0f3460;
    color: #fff;
    border: none;
    padding: 14px 40px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
}
.btn-restart:active {
    transform: scale(0.97);
}
/* شاشة التحميل */
.loading {
    text-align: center;
    padding: 60px 20px;
    color: #666;
    font-size: 0.95rem;
}
/* إشعار الحفظ */
.toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1a1a2e;
    color: #fff;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 0.85rem;
    opacity: 0;
    transition: all 0.3s;
    z-index: 200;
    pointer-events: none;
    white-space: nowrap;
}
.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div class="header">
    <h1>📚 التاريخ الوطني - الوحدة الأولى</h1>
    <p>مصر بين الماضي والحاضر</p>
</div>

<div class="container" id="app"></div>

<div class="bottom-nav" id="bottomNav" style="display:none;">
    <button class="btn-prev" onclick="prevQuestion()">◀ السابق</button>
    <button class="btn-next" onclick="nextQuestion()">التالي ▶</button>
</div>

<div class="toast" id="toast"></div>

        ]
    }
};

// =============================================
// الحالة والتخزين
// =============================================
let state = {
    currentLesson: null,
    currentQuestion: 0,
    userAnswers: {},
    isExamMode: false,
    examQuestions: []
};

// تحميل من localStorage
function loadProgress() {
    try {
        const saved = localStorage.getItem('history_quiz_progress');
        if (saved) {
            return JSON.parse(saved);
        }
    } catch(e) {}
    return {};
}

function saveProgress() {
    try {
        const all = loadProgress();
        const key = state.isExamMode ? 'exam' : state.currentLesson;
        all[key] = {
            userAnswers: state.userAnswers,
            currentQuestion: state.currentQuestion,
            timestamp: Date.now()
        };
        localStorage.setItem('history_quiz_progress', JSON.stringify(all));
    } catch(e) {}
}

// =============================================
// شاشة البداية
// =============================================
function renderHome() {
    state.isExamMode = false;
    const saved = loadProgress();
    const app = document.getElementById('app');
    
    let html = '<div class="home-screen">';
    
    // كارت كل درس
    for (const [key, lesson] of Object.entries(lessons)) {
        const total = lesson.questions.length;
        const answered = saved[key] ? Object.keys(saved[key].userAnswers || {}).length : 0;
        const badgeClass = answered === total ? 'progress-badge done' : 'progress-badge';
        const badgeText = answered === total ? '✓ مكتمل' : `${answered}/${total}`;
        
        html += `
            <div class="home-card" onclick="startLesson('${key}')">
                <div class="icon">${lesson.icon}</div>
                <div class="info">
                    <h3>${lesson.title}</h3>
                    <p>${total} سؤال</p>
                </div>
                <div class="${badgeClass}">${badgeText}</div>
            </div>
        `;
    }
    
    // كارت الامتحان الشامل
    html += `
        <div class="home-card" onclick="startExam()" style="border-right-color: #e74c3c;">
            <div class="icon">📝</div>
            <div class="info">
                <h3>الامتحان الشامل</h3>
                <p>30 سؤال عشوائي من كل الدروس</p>
            </div>
            <div class="progress-badge" style="background:#ffeaea;color:#c0392b;">ابدأ</div>
        </div>
    `;
    
    html += '</div>';
    app.innerHTML = html;
    document.getElementById('bottomNav').style.display = 'none';
}

// =============================================
// بدء درس
// =============================================
function startLesson(key) {
    state.currentLesson = key;
    state.isExamMode = false;
    const saved = loadProgress();
    const lessonData = saved[key];
    
    if (lessonData && lessonData.userAnswers) {
        state.userAnswers = lessonData.userAnswers;
        state.currentQuestion = lessonData.currentQuestion || 0;
    } else {
        state.userAnswers = {};
        state.currentQuestion = 0;
    }
    
    renderQuiz();
    document.getElementById('bottomNav').style.display = 'flex';
}

// =============================================
// بدء الامتحان الشامل
// =============================================
function startExam() {
    state.isExamMode = true;
    state.currentQuestion = 0;
    state.userAnswers = {};
    
    // جمع كل الأسئلة
    let allQuestions = [];
    for (const [key, lesson] of Object.entries(lessons)) {
        lesson.questions.forEach(q => {
            allQuestions.push({...q, lessonKey: key});
        });
    }
    
    // خلط عشوائي
    allQuestions = shuffleArray(allQuestions);
    
    // اختيار 30 سؤال
    state.examQuestions = allQuestions.slice(0, 30);
    
    renderQuiz();
    document.getElementById('bottomNav').style.display = 'flex';
    showToast('📝 امتحان شامل - 30 سؤال');
}

function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// =============================================
// عرض شاشة الأسئلة
// =============================================
function renderQuiz() {
    const app = document.getElementById('app');
    const questions = state.isExamMode ? state.examQuestions : lessons[state.currentLesson].questions;
    const title = state.isExamMode ? '📝 الامتحان الشامل' : lessons[state.currentLesson].title;
    const total = questions.length;
    const current = state.currentQuestion;
    const q = questions[current];
    const userAnswer = state.userAnswers[current];
    const isAnswered = userAnswer !== undefined;
    
    let html = `
        <div class="quiz-screen" style="display:block;">
            <div class="quiz-header">
                <button class="btn-back" onclick="goHome()">←</button>
                <div class="quiz-title">${title}</div>
            </div>
            
            <div class="nav-bar">
    `;
    
    // أزرار التنقل
    for (let i = 0; i < total; i++) {
        let cls = 'nav-btn';
        if (i === current) cls += ' active';
        if (state.userAnswers[i] !== undefined) {
            if (state.userAnswers[i] === questions[i].answer) {
                cls += ' correct';
            } else {
                cls += ' wrong';
            }
        }
        html += `<button class="${cls}" onclick="goToQuestion(${i})">${i+1}</button>`;
    }
    
    html += `
            </div>
            
            <div class="question-card">
                <div class="question-number">السؤال ${current+1} من ${total}</div>
                <div class="question-text">${q.q}</div>
                <div class="options" id="options">
    `;
    
    const letters = ['أ', 'ب', 'ج', 'د'];
    q.options.forEach((opt, idx) => {
        let cls = 'option';
        if (isAnswered) {
            if (idx === q.answer) cls += ' correct';
            else if (idx === userAnswer) cls += ' wrong';
            cls += ' disabled';
        }
        html += `
            <div class="${cls}" onclick="selectAnswer(${idx})">
                <div class="letter">${letters[idx]}</div>
                <div>${opt}</div>
            </div>
        `;
    });
    
    html += `</div>`;
    
    // التصحيح الوقتي
    if (isAnswered) {
        const isCorrect = userAnswer === q.answer;
        html += `
            <div class="feedback show ${isCorrect ? 'correct' : 'wrong'}">
                ${isCorrect ? '✅ إجابة صحيحة! أحسنت.' : `❌ إجابة خاطئة. الإجابة الصحيحة هي: (${letters[q.answer]})`}
            </div>
        `;
    }
    
    html += `
            </div>
        </div>
    `;
    
    app.innerHTML = html;
    updateBottomNav();
    window.scrollTo({top: 0, behavior: 'smooth'});
}

// =============================================
// اختيار إجابة
// =============================================
function selectAnswer(idx) {
    const questions = state.isExamMode ? state.examQuestions : lessons[state.currentLesson].questions;
    const q = questions[state.currentQuestion];
    
    if (state.userAnswers[state.currentQuestion] !== undefined) return;
    
    state.userAnswers[state.currentQuestion] = idx;
    saveProgress();
    
    // إعادة رسم
    renderQuiz();
    
    // إشعار
    if (idx === q.answer) {
        showToast('✅ إجابة صحيحة!');
    } else {
        showToast('❌ إجابة خاطئة');
    }
}

// =============================================
// التنقل بين الأسئلة
// =============================================
function goToQuestion(idx) {
    state.currentQuestion = idx;
    saveProgress();
    renderQuiz();
}

function nextQuestion() {
    const questions = state.isExamMode ? state.examQuestions : lessons[state.currentLesson].questions;
    if (state.currentQuestion < questions.length - 1) {
        state.currentQuestion++;
        saveProgress();
        renderQuiz();
    } else {
        // نهاية الأسئلة - عرض النتيجة
        showResult();
    }
}

function prevQuestion() {
    if (state.currentQuestion > 0) {
        state.currentQuestion--;
        saveProgress();
        renderQuiz();
    }
}

function updateBottomNav() {
    const questions = state.isExamMode ? state.examQuestions : lessons[state.currentLesson].questions;
    const nextBtn = document.querySelector('.btn-next');
    if (nextBtn) {
        if (state.currentQuestion === questions.length - 1) {
            nextBtn.textContent = 'عرض النتيجة 🏁';
        } else {
            nextBtn.textContent = 'التالي ▶';
        }
    }
}

// =============================================
// عرض النتيجة
// =============================================
function showResult() {
    const questions = state.isExamMode ? state.examQuestions : lessons[state.currentLesson].questions;
    let correct = 0;
    let wrong = 0;
    let unanswered = 0;
    
    questions.forEach((q, i) => {
        if (state.userAnswers[i] === undefined) {
            unanswered++;
        } else if (state.userAnswers[i] === q.answer) {
            correct++;
        } else {
            wrong++;
        }
    });
    
    const total = questions.length;
    const percentage = Math.round((correct / total) * 100);
    const app = document.getElementById('app');
    
    let message = '';
    if (percentage >= 90) message = '🏆 ممتاز! أنت متمكن من الوحدة الأولى';
    else if (percentage >= 75) message = '👍 جيد جدًا! راجع بعض النقاط';
    else if (percentage >= 50) message = '📖 مقبول. تحتاج مراجعة';
    else message = '💪 راجع الدروس مرة أخرى';
    
    app.innerHTML = `
        <div class="result-screen" style="display:block;">
            <div class="result-card">
                <h2>${state.isExamMode ? 'نتيجة الامتحان الشامل' : 'نتيجة الدرس'}</h2>
                <div class="result-score">${percentage}%</div>
                <div class="result-details">
                    <span class="green">✓ ${correct}</span>
                    <span class="red">✗ ${wrong}</span>
                    <span>? ${unanswered}</span>
                </div>
                <p style="margin-bottom:20px; color:#666;">${message}</p>
                <button class="btn-restart" onclick="goHome()">العودة للرئيسية</button>
                <button class="btn-restart" style="margin-top:10px; background:#f0f2f5; color:#1a1a2e;" onclick="restartCurrent()">🔄 إعادة</button>
            </div>
        </div>
    `;
    document.getElementById('bottomNav').style.display = 'none';
}

function restartCurrent() {
    if (state.isExamMode) {
        startExam();
    } else {
        state.userAnswers = {};
        state.currentQuestion = 0;
        saveProgress();
        renderQuiz();
        document.getElementById('bottomNav').style.display = 'flex';
    }
}

// =============================================
// العودة للرئيسية
// =============================================
function goHome() {
    saveProgress();
    renderHome();
}

// =============================================
// إشعار
// =============================================
function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => {
        toast.classList.remove('show');
    }, 1500);
}

// =============================================
// بدء التطبيق
// =============================================
renderHome();
</script>
</body>
</html>
